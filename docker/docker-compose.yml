name: pentest-lab

services:
  juice-shop:
    image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
    container_name: lab-target
    restart: "no"
    ports:
      - "3000:3000"
    networks:
      lab_internal:
        ipv4_address: 172.28.0.10
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0

  runner:
    image: python:3.12-slim@sha256:02108f5d322dd89f1c9e552442c25acb0543dfdbc455693a5599624f20d9155d
    container_name: lab-runner
    command: ["sleep", "infinity"]
    working_dir: /work
    volumes:
      - ./runner:/work
    environment:
      OPENAI_BASE_URL: "http://host.docker.internal:11434/v1"
      OPENAI_API_KEY: "ollama"
      TARGET_URL: "http://172.28.0.10:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      lab_internal:
        ipv4_address: 172.28.0.20
      llm_bridge: {}
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g

networks:
  lab_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  llm_bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24